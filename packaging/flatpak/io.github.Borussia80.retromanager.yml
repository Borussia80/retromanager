  # ── retromanager application ────────────────────────────────────────────────
  - name: retromanager
    buildsystem: simple
    build-commands:
      - install -d /app/lib/retromanager
      - cp *.py *.pyw /app/lib/retromanager/
      - cp -r ui/ /app/lib/retromanager/
      - "[ -d resources ] && cp -r resources/ /app/lib/retromanager/ || true"
      - "[ -f resources.rcc ] && cp resources.rcc /app/lib/retromanager/ || true"
      - |
        cat > /app/bin/retromanager << 'WRAPPER'
        #!/usr/bin/env bash
        # Expose host RPM and Flatpak binaries to shutil.which() inside the sandbox
        export PATH="/usr/bin:/usr/local/bin:/var/lib/flatpak/exports/bin:$HOME/.local/share/flatpak/exports/bin:$PATH"
        exec python3 /app/lib/retromanager/app.pyw "$@"
        WRAPPER
        chmod +x /app/bin/retromanager
      - |
        install -Dm644 packaging/retromanager.desktop \
            /app/share/applications/io.github.Borussia80.retromanager.desktop
        sed -i 's|^Icon=.*|Icon=io.github.Borussia80.retromanager|' \
            /app/share/applications/io.github.Borussia80.retromanager.desktop
      - |
        for size in 16 32 48 64 128 256 512; do
          f="resources/icons/icon_${size}.png"
          [ -f "$f" ] && install -Dm644 "$f" \
              "/app/share/icons/hicolor/${size}x${size}/apps/io.github.Borussia80.retromanager.png"
        done
      - install -Dm644 packaging/flatpak/io.github.Borussia80.retromanager.appdata.xml \
            /app/share/metainfo/io.github.Borussia80.retromanager.appdata.xml
    sources:
      - type: git
        url: https://github.com/Borussia80/retromanager.git
        tag: v2.1.0
