---
# Flatpak manifest for retromanager — Fedora KDE6 runtime (f44).
#
# Prerequisites:
#   sudo dnf install flatpak-builder
#   flatpak install fedora org.fedoraproject.KDE6Platform//f44
#   flatpak install fedora org.fedoraproject.KDE6Sdk//f44
#
# Build & install locally:
#   flatpak-builder --user --install --force-clean \
#       build-flatpak \
#       packaging/flatpak/io.github.Borussia80.retromanager.yml

app-id: io.github.Borussia80.retromanager
runtime: org.fedoraproject.KDE6Platform
runtime-version: f44
sdk: org.fedoraproject.KDE6Sdk
command: retromanager

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  # Allow finding host RPM-installed binaries (retroarch, lutris)
  - --filesystem=/usr:ro
  - --filesystem=/usr/local:ro
  # Allow finding Flatpak-installed app wrappers (org.libretro.RetroArch, net.lutris.Lutris)
  - --filesystem=/var/lib/flatpak/exports/bin:ro
  - --filesystem=xdg-data/flatpak/exports/bin:ro

modules:
