[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "retromanager"
version = "2.3.3"
description = "Linux desktop app to browse and download retro game ROMs from Archive.org"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6",
    "requests>=2.31",
    "py7zr>=0.21",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long — handled by black
    "B008",   # do not perform function calls in default arguments
    "SIM108", # use ternary operator — sometimes less readable
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false  # PyQt6 slots are untyped; strict=true fails on them

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "make_*.py",
    "ui/*",
    "*.pyw",
]
